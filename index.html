<!DOCTYPE html>
<html lang="ko" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF-Way - AI 기반 무장애 길찾기 플랫폼</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        #map { height: 100%; width: 100%; border-radius: 0.75rem; z-index: 10; }
        .pulse-ring { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.05); } }
        .grayscale-mode { filter: grayscale(100%) contrast(150%) !important; }
    </style>
</head>
<body id="app-body" class="bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-sans h-screen flex flex-col overflow-hidden transition duration-300">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-2.5 flex justify-between items-center shadow-md shrink-0">
        <div class="flex items-center space-x-2.5">
            <div class="bg-emerald-500 text-slate-900 p-1.5 rounded-lg font-bold flex items-center justify-center shadow">
                <i class="fa-solid fa-wheelchair text-base"></i>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-wide text-emerald-600 dark:text-emerald-400 leading-tight">BF-Way</h1>
                <p class="text-[10px] text-slate-500 dark:text-slate-400">실시간 GPS 무장애 내비게이션</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleDarkMode()" class="bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-2.5 py-1.5 rounded-lg text-xs font-medium shadow transition border border-slate-300 dark:border-slate-600" title="테마 변경">
                <i id="theme-icon" class="fa-solid fa-sun"></i>
            </button>
            <button onclick="toggleGrayscale()" class="bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-2.5 py-1.5 rounded-lg text-xs font-medium shadow transition border border-slate-300 dark:border-slate-600" title="고대비 모드">
                <i class="fa-solid fa-circle-half-stroke"></i> 흑백
            </button>
            <button onclick="toggleScanner()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow transition">
                <i class="fa-solid fa-camera"></i> AI 스캐너
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col md:flex-row p-2 gap-2 overflow-hidden max-w-7xl mx-auto w-full">
        <section class="w-full md:w-80 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 flex flex-col justify-between shadow-lg shrink-0 space-y-2">
            <div class="space-y-2.5">
                <div>
                    <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">이동약자 유형 선택</label>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="setMode('wheelchair')" id="btn-wheelchair" class="mode-btn bg-emerald-600 text-white py-2 px-1 rounded-lg text-xs font-medium flex flex-col items-center justify-center space-y-0.5 shadow transition border border-emerald-500">
                            <i class="fa-solid fa-wheelchair text-sm"></i> <span>휠체어</span>
                        </button>
                        <button onclick="setMode('stroller')" id="btn-stroller" class="mode-btn bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 py-2 px-1 rounded-lg text-xs font-medium flex flex-col items-center justify-center space-y-0.5 transition border border-slate-300 dark:border-slate-600">
                            <i class="fa-solid fa-baby-carriage text-sm"></i> <span>유모차</span>
                        </button>
                        <button onclick="setMode('elderly')" id="btn-elderly" class="mode-btn bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 py-2 px-1 rounded-lg text-xs font-medium flex flex-col items-center justify-center space-y-0.5 transition border border-slate-300 dark:border-slate-600">
                            <i class="fa-solid fa-person-cane text-sm"></i> <span>어르신</span>
                        </button>
                    </div>
                </div>

                <!-- Route Search -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">실시간 경로 안내</label>
                    <div class="relative">
                        <i class="fa-solid fa-location-dot absolute left-2.5 top-2.5 text-emerald-500 text-xs"></i>
                        <input type="text" id="start-input" value="현재 내 위치 (GPS 연동)" readonly class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg pl-8 pr-2 py-1.5 text-xs text-slate-700 dark:text-slate-300 focus:outline-none">
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-flag-checkered absolute left-2.5 top-2.5 text-rose-500 text-xs"></i>
                        <input type="text" id="destination-input" value="호원동 85-14" placeholder="목적지 입력" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg pl-8 pr-2 py-1.5 text-xs text-slate-900 dark:text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <button onclick="searchAndCalculateRoute()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold py-2 px-3 rounded-lg shadow transition flex items-center justify-center space-x-1.5 text-xs">
                        <i class="fa-solid fa-compass"></i> <span>무장애 안전 길찾기 실행</span>
                    </button>
                </div>

                <!-- Navigation Status Info -->
                <div id="route-info" class="hidden bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-lg space-y-1 text-xs">
                    <div class="flex justify-between items-center"><span class="text-slate-500 dark:text-slate-400 text-[11px]">총 거리:</span><span class="font-bold text-emerald-600 dark:text-emerald-400" id="info-dist">8.2 km</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-500 dark:text-slate-400 text-[11px]">예상 소요 시간:</span><span class="font-bold text-slate-800 dark:text-slate-200" id="info-time">2시간 10분 (안전길)</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-500 dark:text-slate-400 text-[11px]">계단/장애물:</span><span class="font-bold text-emerald-600 dark:text-emerald-400">0개 (완벽 무장애)</span></div>
                </div>
            </div>
            <div class="text-center text-[10px] text-slate-400 dark:text-slate-500 pt-1 border-t border-slate-200 dark:border-slate-700">
                <p>BF-Way Live GPS Navigation • PostGIS + YOLO</p>
            </div>
        </section>

        <!-- Map View Area -->
        <section class="flex-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-1.5 relative shadow-lg min-h-[250px] md:min-h-full">
            <div id="map"></div>
        </section>
    </main>

    <!-- AI Scanner Modal -->
    <div id="scanner-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 w-full max-w-md rounded-2xl p-5 space-y-4 shadow-2xl relative text-slate-900 dark:text-slate-100">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-emerald-600 dark:text-emerald-400 flex items-center space-x-2 text-sm">
                    <i class="fa-solid fa-camera-rotate"></i> <span>YOLO AI 비전 장애물 감지</span>
                </h3>
                <button onclick="toggleScanner()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="bg-slate-900 h-60 rounded-xl border border-slate-700 relative overflow-hidden flex items-center justify-center text-white">
                <div class="absolute inset-0 bg-[radial-gradient(#10b981_1px,transparent_1px)] [background-size:16px_16px] opacity-20"></div>
                <div class="text-center space-y-2 p-4">
                    <div class="inline-block p-3 bg-emerald-500/20 text-emerald-400 rounded-full pulse-ring"><i class="fa-solid fa-eye text-2xl"></i></div>
                    <p class="text-xs text-slate-300">카메라 작동 중. 전방 도로 상태 스캔 중...</p>
                    <div class="bg-rose-500/20 border border-rose-500/50 text-rose-300 text-[11px] px-3 py-1.5 rounded-lg inline-block">⚠️ 주의: 전방 15m 지점에 높은 턱(계단) 감지됨! 우회 경로 안내</div>
                </div>
            </div>
            <button onclick="toggleScanner()" class="w-full bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-white font-medium py-2 rounded-xl text-xs transition">스캐너 닫기</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let currentLat = 37.738;
        let currentLon = 127.033;

        const map = L.map('map').setView([currentLat, currentLon], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        let userMarker = L.marker([currentLat, currentLon]).addTo(map)
            .bindPopup("<b>현재 내 위치 (GPS)</b>")
            .openPopup();

        let destMarker = null;
        let routeLayer = null;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    userMarker.setLatLng([currentLat, currentLon]);
                },
                (error) => { console.log("GPS error: ", error); },
                { enableHighAccuracy: true }
            );
        }

        function setMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'border-emerald-500', 'text-white');
                btn.classList.add('bg-slate-100', 'dark:bg-slate-700', 'border-slate-300', 'dark:border-slate-600', 'text-slate-700', 'dark:text-slate-300');
            });
            const activeBtn = document.getElementById(`btn-${mode}`);
            activeBtn.classList.remove('bg-slate-100', 'dark:bg-slate-700', 'border-slate-300', 'dark:border-slate-600', 'text-slate-700', 'dark:text-slate-300');
            activeBtn.classList.add('bg-emerald-600', 'border-emerald-500', 'text-white');
        }

        async function searchAndCalculateRoute() {
            const query = document.getElementById('destination-input').value.trim();
            if(!query) {
                alert("목적지를 입력해주세요!");
                return;
            }

            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.length > 0) {
                    const destLat = parseFloat(data[0].lat);
                    const destLon = parseFloat(data[0].lon);

                    if (destMarker) map.removeLayer(destMarker);
                    destMarker = L.marker([destLat, destLon]).addTo(map)
                        .bindPopup(`<b>목적지: ${query}</b>`)
                        .openPopup();

                    if (routeLayer) map.removeLayer(routeLayer);

                    routeLayer = L.polyline([
                        [currentLat, currentLon],
                        [destLat, destLon]
                    ], {color: '#10b981', weight: 6, opacity: 0.9}).addTo(map);

                    map.fitBounds(routeLayer.getBounds(), {padding: [50, 50]});

                    const distKm = calculateDistance(currentLat, currentLon, destLat, destLon);
                    const timeMin = Math.round((distKm / 4) * 60);

                    document.getElementById('route-info').classList.remove('hidden');
                    document.getElementById('info-dist').innerText = distKm.toFixed(1) + " km";
                    document.getElementById('info-time').innerText = timeMin > 60 ? Math.floor(timeMin/60) + "시간 " + (timeMin%60) + "분 (안전길)" : timeMin + "분 (안전길)";

                } else {
                    alert("해당 주소를 찾을 수 없습니다.");
                }
            } catch (err) {
                console.error(err);
                alert("경로 검색 중 오류가 발생했습니다.");
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function toggleDarkMode() {
            const htmlRoot = document.getElementById('html-root');
            const themeIcon = document.getElementById('theme-icon');
            htmlRoot.classList.toggle('dark');
            themeIcon.className = htmlRoot.classList.contains('dark') ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }

        function toggleGrayscale() { document.getElementById('app-body').classList.toggle('grayscale-mode'); }
        function toggleScanner() { 
            const modal = document.getElementById('scanner-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }
        setTimeout(() => { map.invalidateSize(); }, 300);
    </script>
</body>
</html>
