<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8fafc" />
  <title>BF-Way | Barrier-Free Navigation</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      transition: background .25s, color .25s;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app-shell { max-width: 1440px; margin: auto; min-height: 100vh; }
    .surface { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; }
    .muted { color: var(--muted); }
    .primary-btn {
      background: var(--primary); color: white; border-radius: 14px;
      padding: 13px 18px; font-weight: 700; transition: .2s;
    }
    .primary-btn:hover { filter: brightness(.94); transform: translateY(-1px); }
    .secondary-btn {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; padding: 11px 14px; font-weight: 600;
    }
    .mode-card {
      border: 1px solid var(--border); background: var(--surface);
      border-radius: 15px; padding: 13px 9px; text-align: center; transition: .2s; min-width: 0;
    }
    .mode-card.active {
      border: 2px solid var(--primary); background: var(--primary-light); color: var(--primary); padding: 12px 8px;
    }
    #map { height: 540px; width: 100%; border-radius: 18px; z-index: 1; background: #e2e8f0; }
    .map-overlay { position: absolute; z-index: 500; top: 14px; right: 14px; display: flex; flex-direction: column; gap: 8px; }
    .map-control {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 12px; background: white; color: #0f172a; box-shadow: 0 2px 10px #00000018;
    }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: #94a3b8; }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 0 4px #22c55e20; }
    .loader {
      width: 18px; height: 18px; border: 2px solid #ffffff70; border-top-color: white;
      border-radius: 50%; animation: spin .7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-backdrop {
      position: fixed; inset: 0; background: #0f172a99; z-index: 2000;
      display: none; align-items: center; justify-content: center; padding: 18px;
    }
    .modal-backdrop.show { display: flex; }
    .modal-card { width: 100%; max-width: 460px; background: var(--surface); color: var(--text); border-radius: 24px; padding: 24px; box-shadow: 0 20px 60px #00000030; }
    .scanner-preview {
      min-height: 190px; border-radius: 18px; background: linear-gradient(135deg, #dbeafe, #eff6ff);
      display: flex; align-items: center; justify-content: center; color: #2563eb; position: relative; overflow: hidden;
    }
    .scanner-line {
      position: absolute; left: 0; right: 0; height: 2px; background: #2563eb;
      box-shadow: 0 0 15px #2563eb; animation: scan 2.5s ease-in-out infinite;
    }
    @keyframes scan { 0%, 100% { top: 15%; } 50% { top: 85%; } }
    .dark { --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --primary-light: #1e3a8a; }
    .dark .mode-card.active { background: #1e3a8a; color: #bfdbfe; }
    .dark .map-control { background: #1e293b; color: white; }
    .dark .scanner-preview { background: linear-gradient(135deg, #1e3a8a, #1e293b); }
    .grayscale { filter: grayscale(1); }
  </style>
</head>

<body>
  <div class="app-shell">
    <header class="px-4 md:px-8 py-5 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-blue-600 text-white grid place-items-center">
          <i data-lucide="accessibility" class="w-7 h-7"></i>
        </div>
        <div>
          <h1 class="text-xl font-black tracking-tight">BF-Way</h1>
          <p class="text-xs muted">Barrier-Free Navigation</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="grayscaleBtn" class="secondary-btn !p-3" title="흑백 모드"><i data-lucide="contrast" class="w-5 h-5"></i></button>
        <button id="themeBtn" class="secondary-btn !p-3" title="다크 모드"><i data-lucide="moon" class="w-5 h-5"></i></button>
      </div>
    </header>

    <main class="px-4 md:px-8 pb-10">
      <section class="surface p-4 md:p-5 mb-5">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="font-bold">이동 유형 선택</h3>
            <p class="text-xs muted mt-1">나에게 맞는 이동 방식을 선택하세요.</p>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2 md:gap-3">
          <button class="mode-card active" data-mode="wheelchair">
            <div class="text-2xl mb-2">♿</div>
            <div class="font-bold text-sm">휠체어</div>
          </button>
          <button class="mode-card" data-mode="stroller">
            <div class="text-2xl mb-2">👶</div>
            <div class="font-bold text-sm">유모차</div>
          </button>
          <button class="mode-card" data-mode="elderly">
            <div class="text-2xl mb-2">🚶</div>
            <div class="font-bold text-sm">고령자</div>
          </button>
        </div>
      </section>

      <section class="surface p-4 md:p-5 mb-5">
        <div class="flex items-center gap-2 mb-4">
          <i data-lucide="map-pin" class="w-5 h-5 text-blue-600"></i>
          <h3 class="font-bold">목적지 설정 및 길안내</h3>
        </div>
        <div class="space-y-3">
          <div class="flex gap-2">
            <input id="destinationInput" type="text" placeholder="목적지를 입력하세요. 예: 노원역, 의정부역" class="w-full rounded-xl border border-slate-200 bg-transparent px-4 py-3 text-sm outline-none focus:border-blue-500" autocomplete="off" />
            <button id="searchBtn" class="secondary-btn whitespace-nowrap flex items-center gap-2"><i data-lucide="search" class="w-4 h-4"></i> 검색</button>
          </div>
          <button id="startRouteBtn" class="primary-btn w-full flex items-center justify-center gap-2 !py-3.5 text-base shadow-lg">
            <i data-lucide="navigation" class="w-5 h-5"></i> 무장애 안전 길안내 시작
          </button>
          <div class="flex flex-wrap gap-2 pt-1">
            <button id="gpsBtn" class="secondary-btn flex items-center gap-2 text-sm"><i data-lucide="locate-fixed" class="w-4 h-4"></i> 현재 위치</button>
            <button id="resetBtn" class="secondary-btn flex items-center gap-2 text-sm"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> 초기화</button>
          </div>
          <p id="statusMessage" class="text-xs muted">현재 위치를 확인한 후 목적지를 검색하고 길안내를 시작하세요.</p>
        </div>
      </section>

      <section class="surface p-3 md:p-4 mb-5">
        <div class="flex items-center justify-between px-1 mb-3">
          <h3 class="font-bold">실시간 지도</h3>
          <span class="text-xs flex items-center gap-2 muted">
            <span id="gpsDot" class="status-dot"></span>
            <span id="gpsStatus">GPS 대기 중</span>
          </span>
        </div>
        <div class="relative">
          <div id="map"></div>
          <div class="map-overlay">
            <button id="zoomInBtn" class="map-control"><i data-lucide="plus" class="w-5 h-5"></i></button>
            <button id="zoomOutBtn" class="map-control"><i data-lucide="minus" class="w-5 h-5"></i></button>
            <button id="locateMapBtn" class="map-control"><i data-lucide="crosshair" class="w-5 h-5"></i></button>
          </div>
        </div>
      </section>

      <section class="surface p-4 md:p-5 mb-5">
        <h3 class="font-bold mb-4">경로 정보</h3>
        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-2xl p-4 bg-slate-50 dark:bg-slate-800">
            <div class="text-xs muted mb-2">이동 거리</div>
            <div id="distanceValue" class="text-2xl font-black">--</div>
          </div>
          <div class="rounded-2xl p-4 bg-slate-50 dark:bg-slate-800">
            <div class="text-xs muted mb-2">예상 시간</div>
            <div id="timeValue" class="text-2xl font-black">--</div>
          </div>
        </div>
        <p id="routeMessage" class="text-xs muted mt-3">출발지와 목적지를 설정하면 경로를 검색할 수 있습니다.</p>
      </section>

      <section class="rounded-3xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-5 md:p-7 mb-5">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-5">
          <div>
            <h3 class="text-xl md:text-2xl font-black mb-2">주변 환경을 확인해 보세요.</h3>
            <p class="text-sm text-blue-100">카메라를 활용한 장애물 인식 데모 화면입니다.</p>
          </div>
          <button id="scannerBtn" class="bg-white text-blue-700 rounded-xl px-5 py-3 font-bold flex items-center justify-center gap-2">
            <i data-lucide="camera" class="w-5 h-5"></i> AI Scanner
          </button>
        </div>
      </section>
    </main>
  </div>

  <div id="scannerModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-lg font-black">AI 환경 스캐너</h3>
        <button id="closeScannerBtn" class="secondary-btn !p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="scanner-preview mb-4">
        <div class="scanner-line"></div>
        <div class="text-center">
          <i data-lucide="scan" class="w-14 h-14 mx-auto mb-2"></i>
          <p class="font-bold">AI Scanner Preview (DEMO)</p>
        </div>
      </div>
      <button id="closeScannerBottomBtn" class="primary-btn w-full">확인</button>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let selectedMode = "wheelchair";
    let currentPosition = null;
    let destinationPosition = null;
    let userMarker = null;
    let destinationMarker = null;
    let routeLayer = null;
    let gpsWatchId = null;
    let isSearching = false;
    const defaultCenter = [37.5665, 126.9780];

    const map = L.map("map", { zoomControl: false, preferCanvas: true }).setView(defaultCenter, 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
    setTimeout(() => map.invalidateSize(), 300);

    const userIcon = L.divIcon({ className: "", html: `<div style="width:22px;height:22px;border:4px solid white;border-radius:50%;background:#2563eb;box-shadow:0 2px 12px #0005;"></div>`, iconSize: [22, 22], iconAnchor: [11, 11] });
    const destinationIcon = L.divIcon({ className: "", html: `<div style="width:28px;height:28px;border:3px solid white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ef4444;box-shadow:0 2px 12px #0004;"></div>`, iconSize: [28, 28], iconAnchor: [14, 28] });

    function setStatus(msg, type="normal") {
      const el = $("statusMessage");
      el.textContent = msg;
      el.className = "text-xs mt-1 " + (type === "error" ? "text-red-500" : type === "success" ? "text-green-600" : "muted");
    }

    function updateUserLocation(lat, lng, acc) {
      currentPosition = [lat, lng];
      if (!userMarker) {
        userMarker = L.marker(currentPosition, { icon: userIcon }).addTo(map).bindPopup("현재 위치");
      } else {
        userMarker.setLatLng(currentPosition);
      }
      $("gpsDot").classList.add("online");
      $("gpsStatus").textContent = "GPS 연결됨";
      if (acc) setStatus(`현재 위치 확인 완료 (정확도 약 ${Math.round(acc)}m)`, "success");
    }

    function startGPS() {
      if (!navigator.geolocation) { setStatus("위치 서비스를 지원하지 않습니다.", "error"); return; }
      $("gpsBtn").disabled = true;
      $("gpsBtn").textContent = "위치 확인 중...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          updateUserLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
          map.setView(currentPosition, 16);
          $("gpsBtn").disabled = false;
          $("gpsBtn").innerHTML = '<i data-lucide="locate-fixed" class="w-4 h-4"></i> 현재 위치';
          if (!gpsWatchId) {
            gpsWatchId = navigator.geolocation.watchPosition((p) => updateUserLocation(p.coords.latitude, p.coords.longitude, p.coords.accuracy));
          }
        },
        (err) => {
          setStatus("현재 위치를 확인하지 못했습니다.", "error");
          $("gpsBtn").disabled = false;
          $("gpsBtn").innerHTML = '<i data-lucide="locate-fixed" class="w-4 h-4"></i> 현재 위치';
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }

    document.querySelectorAll("[data-mode]").forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedMode = btn.dataset.mode;
        document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("active", b === btn));
      });
    });

    async function findDestination() {
      const query = $("destinationInput").value.trim();
      if (!query) { setStatus("목적지를 입력해 주세요.", "error"); return; }
      if (isSearching) return;
      isSearching = true;
      $("searchBtn").innerHTML = '<span class="loader"></span>';

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(query)}`);
        const results = await res.json();
        if (!results.length) throw new Error("검색 결과가 없습니다.");
        
        const r = results[0];
        destinationPosition = [Number(r.lat), Number(r.lon)];
        if (destinationMarker) map.removeLayer(destinationMarker);
        destinationMarker = L.marker(destinationPosition, { icon: destinationIcon }).addTo(map).bindPopup(r.display_name);
        map.setView(destinationPosition, 15);
        setStatus("목적지를 찾았습니다.", "success");
      } catch (e) {
        setStatus(e.message, "error");
      } finally {
        isSearching = false;
        $("searchBtn").innerHTML = '<i data-lucide="search" class="w-4 h-4"></i> 검색';
        lucide.createIcons();
      }
    }

    // Reliable Distance Calculation (Haversine formula)
    function calculateRouteLocally() {
      if (!currentPosition) {
        alert("먼저 '현재 위치' 버튼을 눌러 GPS를 켜주세요!");
        startGPS();
        return;
      }
      if (!destinationPosition) {
        alert("목적지를 먼저 검색해주세요!");
        return;
      }

      if (routeLayer) map.removeLayer(routeLayer);

      // Draw route line
      routeLayer = L.polyline([currentPosition, destinationPosition], { color: '#16a34a', weight: 6, opacity: 0.9 }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), { padding: [45, 45] });

      // Calculate distance in km
      const lat1 = currentPosition[0], lon1 = currentPosition[1];
      const lat2 = destinationPosition[0], lon2 = destinationPosition[1];
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const distKm = R * c;

      // Time calculation (Walking speed ~ 4 km/h)
      const totalMinutes = Math.max(1, Math.round((distKm / 4) * 60));

      $("distanceValue").textContent = distKm < 1 ? `${Math.round(distKm * 1000)} m` : `${distKm.toFixed(2)} km`;
      $("timeValue").textContent = totalMinutes >= 60 ? `${Math.floor(totalMinutes/60)}시간 ${totalMinutes%60}분` : `${totalMinutes}분`;
      $("routeMessage").textContent = "무장애 안전 경로 안내가 시작되었습니다.";
    }

    // Modal Events
    $("scannerBtn").addEventListener("click", () => $("scannerModal").classList.add("show"));
    $("closeScannerBtn").addEventListener("click", () => $("scannerModal").classList.remove("show"));
    $("closeScannerBottomBtn").addEventListener("click", () => $("scannerModal").classList.remove("show"));

    $("zoomInBtn").addEventListener("click", () => map.zoomIn());
    $("zoomOutBtn").addEventListener("click", () => map.zoomOut());
    $("locateMapBtn").addEventListener("click", () => currentPosition && map.setView(currentPosition, 17));

    $("gpsBtn").addEventListener("click", startGPS);
    $("searchBtn").addEventListener("click", findDestination);
    $("startRouteBtn").addEventListener("click", calculateRouteLocally);
    $("destinationInput").addEventListener("keydown", (e) => e.key === "Enter" && findDestination());
    $("resetBtn").addEventListener("click", () => {
      $("destinationInput").value = "";
      if (destinationMarker) { map.removeLayer(destinationMarker); destinationMarker = null; }
      if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
      $("distanceValue").textContent = "--";
      $("timeValue").textContent = "--";
      $("routeMessage").textContent = "초기화되었습니다.";
    });

    lucide.createIcons();
  </script>
</body>
</html>
