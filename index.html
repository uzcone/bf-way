<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B my map - 이동약자를 위한 길찾기 서비스</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        #map { height: 100%; width: 100%; border-radius: 1rem; }
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-500 text-slate-900 p-2 rounded-xl font-bold flex items-center justify-center shadow-md">
                <i class="fa-solid fa-wheelchair text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-emerald-400">B my map</h1>
                <p class="text-xs text-slate-400">이동약자의 이동권 보장을 위한 길찾기</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleScanner()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center space-x-1.5 shadow transition">
                <i class="fa-solid fa-camera"></i>
                <span class="hidden sm:inline">AI YOLO 스캐너</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col md:flex-row p-3 gap-3 max-w-7xl mx-auto w-full">
        
        <!-- Sidebar / Control Panel -->
        <section class="w-full md:w-80 bg-slate-800 border border-slate-700 rounded-2xl p-4 flex flex-col justify-between shadow-xl space-y-4">
            
            <div class="space-y-4">
                <!-- User Mode Selection -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">이동약자 유형 선택</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setMode('wheelchair')" id="btn-wheelchair" class="mode-btn bg-emerald-600 text-white p-2.5 rounded-xl text-xs font-medium flex flex-col items-center justify-center space-y-1 shadow transition border border-emerald-500">
                            <i class="fa-solid fa-wheelchair text-base"></i>
                            <span>휠체어</span>
                        </button>
                        <button onclick="setMode('stroller')" id="btn-stroller" class="mode-btn bg-slate-700 text-slate-300 hover:bg-slate-600 p-2.5 rounded-xl text-xs font-medium flex flex-col items-center justify-center space-y-1 transition border border-slate-600">
                            <i class="fa-solid fa-baby-carriage text-base"></i>
                            <span>유모차</span>
                        </button>
                        <button onclick="setMode('elderly')" id="btn-elderly" class="mode-btn bg-slate-700 text-slate-300 hover:bg-slate-600 p-2.5 rounded-xl text-xs font-medium flex flex-col items-center justify-center space-y-1 transition border border-slate-600">
                            <i class="fa-solid fa-person-cane text-base"></i>
                            <span>어르신</span>
                        </button>
                    </div>
                </div>

                <!-- Route Search -->
                <div class="space-y-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">경로 검색</label>
                    <div class="relative">
                        <i class="fa-solid fa-location-dot absolute left-3 top-3 text-emerald-400"></i>
                        <input type="text" value="출발지: 상봉터미널" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-3 py-2 text-sm text-slate-300 focus:outline-none">
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-flag-checkered absolute left-3 top-3 text-rose-400"></i>
                        <select id="destination-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="office">중랑구청 (안심 경로 추천)</option>
                            <option value="park">중화근린공원 (경사로 완만)</option>
                            <option value="station">신내역 (엘리베이터 우선)</option>
                        </select>
                    </div>
                    <button onclick="calculateRoute()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold py-2.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-route"></i>
                        <span>안전 경로 찾기</span>
                    </button>
                </div>

                <!-- Navigation Status Info -->
                <div id="route-info" class="hidden bg-slate-900/80 border border-slate-700 p-3 rounded-xl space-y-2">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-400">총 거리:</span>
                        <span class="font-bold text-emerald-400" id="info-dist">1.2 km</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-400">소요 시간:</span>
                        <span class="font-bold text-slate-200" id="info-time">52분 (안전 경로)</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-400">계단/장애물 수:</span>
                        <span class="font-bold text-emerald-400">0개 (무장애)</span>
                    </div>
                </div>
            </div>

            <!-- Footer info -->
            <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-700">
                <p>제4회 유니버설디자인 아이디어 대전 최우수상</p>
                <p class="text-emerald-500/80">PostGIS + A* + YOLO Vision</p>
            </div>
        </section>

        <!-- Map View Area -->
        <section class="flex-1 bg-slate-800 border border-slate-700 rounded-2xl p-2 relative shadow-xl min-h-[400px]">
            <div id="map"></div>
        </section>
    </main>

    <!-- AI Scanner Modal (Simulated) -->
    <div id="scanner-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-5 space-y-4 shadow-2xl relative">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-emerald-400 flex items-center space-x-2">
                    <i class="fa-solid fa-camera-rotate"></i>
                    <span>YOLO AI 비전 장애물 감지</span>
                </h3>
                <button onclick="toggleScanner()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="bg-slate-900 h-64 rounded-xl border border-slate-700 relative overflow-hidden flex items-center justify-center">
                <div class="absolute inset-0 bg-[radial-gradient(#10b981_1px,transparent_1px)] [background-size:16px_16px] opacity-20"></div>
                <!-- Simulated Camera View -->
                <div class="text-center space-y-2 p-4">
                    <div class="inline-block p-3 bg-emerald-500/20 text-emerald-400 rounded-full pulse-ring">
                        <i class="fa-solid fa-eye text-2xl"></i>
                    </div>
                    <p class="text-sm text-slate-300">카메라 작동 중. 전방 도로 상태 스캔 중...</p>
                    <div class="bg-rose-500/20 border border-rose-500/50 text-rose-300 text-xs px-3 py-1.5 rounded-lg inline-block">
                        ⚠️ 주의: 전방 15m 지점에 높은 턱(계단) 감지됨! 우회 경로 안내
                    </div>
                </div>
            </div>

            <button onclick="toggleScanner()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 rounded-xl text-sm transition">
                스캐너 닫기
            </button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map centered around Seoul (Jungnang-gu area)
        const map = L.map('map').setView([37.595, 127.092], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Marker for Sangbong Terminal / Jungnang-gu
        const currentMarker = L.marker([37.595, 127.092]).addTo(map)
            .bindPopup("<b>상봉터미널 (출발지)</b>")
            .openPopup();

        let routeLayer = null;

        function setMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'border-emerald-500', 'text-white');
                btn.classList.add('bg-slate-700', 'border-slate-600', 'text-slate-300');
            });
            const activeBtn = document.getElementById(`btn-${mode}`);
            activeBtn.classList.remove('bg-slate-700', 'border-slate-600', 'text-slate-300');
            activeBtn.classList.add('bg-emerald-600', 'border-emerald-500', 'text-white');
        }

        function calculateRoute() {
            const destType = document.getElementById('destination-select').value;
            let destCoords = [37.606, 127.092]; // Jungnang-gu Office
            let distText = "1.2 km";
            let timeText = "52분 (안전 경로)";

            if (destType === 'park') {
                destCoords = [37.600, 127.085];
                distText = "850 m";
                timeText = "35분 (안전 경로)";
            } else if (destType === 'station') {
                destCoords = [37.615, 127.100];
                distText = "2.1 km";
                timeText = "1시간 10분 (안전 경로)";
            }

            if (routeLayer) {
                map.removeLayer(routeLayer);
            }

            // Draw safe route polyline
            routeLayer = L.polyline([
                [37.595, 127.092],
                [37.598, 127.095],
                destCoords
            ], {color: '#10b981', weight: 5, opacity: 0.8}).addTo(map);

            map.fitBounds(routeLayer.getBounds(), {padding: [50, 50]});

            document.getElementById('route-info').classList.remove('hidden');
            document.getElementById('info-dist').innerText = distText;
            document.getElementById('info-time').innerText = timeText;
        }

        function toggleScanner() {
            const modal = document.getElementById('scanner-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }
    </script>
</body>
</html>
